<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio de Soufiane Amousse, apprenant développeur web.">
    <title>Soufiane Amousse — Contact</title>

    <!-- Police Poppins (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ========== EN-TÊTE ========== -->
    <header class="en-tete">
        <div class="conteneur en-tete__contenu">
            <a class="logo" href="index.html">Soufiane Amousse</a>
            <nav aria-label="Navigation principale">
                <ul class="menu">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="a-propos.html">À propos</a></li>
                    <li><a href="projets.html">Projets</a></li>
                    <li><a class="active" href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="section page-contact">
            <div class="conteneur contact__grille">

                <div class="contact__infos">
                    <h1>Contact</h1>
                    <p>Une question, une proposition ? Écrivez-moi.</p>
                    <ul class="reseaux">
                        <li>
                            <a class="lien" href="https://github.com/soufanDesi" target="_blank"
                                rel="noopener noreferrer">
                                <span class="reseaux__icone">
                                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/github/github-original.svg"
                                        alt="">
                                </span>
                                GitHub
                            </a>
                        </li>

                        <li>
                            <a class="lien" href="#">
                                <span class="reseaux__icone">
                                    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linkedin/linkedin-original.svg"
                                        alt="">
                                </span>
                                LinkedIn
                            </a>
                        </li>
                    </ul>
                </div>

                <form class="formulaire" action="#" method="post">
                    <label for="nom">Nom</label>
                    <input id="nom" name="nom" type="text" required>

                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" required>

                    <label for="sujet">Sujet</label>
                    <input id="sujet" name="sujet" type="text" required>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>

                    <button class="bouton" type="submit">Envoyer</button>
                </form>



            </div>
        </section>

    </main>





    <!-- ========== PIED DE PAGE ========== -->
    <footer class="pied">
        <div class="conteneur">
            <p>© 2026 Soufiane Amousse. Tous droits réservés.</p>
        </div>
    </footer>

</body>

</html>
